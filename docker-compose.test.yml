services:
  postgres-test:
    image: postgres:16-alpine
    container_name: tokenforge-core-server-postgres-test
    environment:
      POSTGRES_USER: tokenforge
      POSTGRES_PASSWORD: tokenforge
      POSTGRES_DB: tokenforge_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenforge -d tokenforge_test"]
      interval: 2s
      timeout: 5s
      retries: 20
